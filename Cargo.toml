[dependencies]
macroquad = { version = "0.4.15", features = ["audio"] }
macroquad-particles = "0.2.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_ron = "1.0.0"
time = { version = "0.3", features = ["local-offset", "formatting"] }
